{% extends "base.html" %}

{% block content %}

<h1>Checkout</h1>
{% for item in foods %}

    <h3>{{ item.food.name }}</h3>

    <p>Price: ₹{{ item.food.price }}</p>

    <p>Quantity: {{ item.quantity }}</p>

    <p>Subtotal: ₹{{ item.subtotal }}</p>

{% endfor %}
<h2>Total: ₹{{ total }}</h2>
<form method="POST">
    {% csrf_token %}

    <button type="submit">Place Order</button>
</form>

{% endblock %}
