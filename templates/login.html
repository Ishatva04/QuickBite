{% extends "base.html" %}

{% block content %}

<h1>Login</h1>
{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="POST">

    {% csrf_token %}

    <input type="hidden" name="next" value="{{ next }}">
    <label>Username</label>
    <input type="text" name="username">

    <label>Password</label>
    <input type="password" name="password">

    <button type="submit">Login</button>

</form>

{% endblock %}
